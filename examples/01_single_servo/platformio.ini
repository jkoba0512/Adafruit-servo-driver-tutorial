; Chapter 1: 1個のサーボを動かす（基本動作）
; PlatformIO 用プロジェクト設定ファイル
;
; 使い方（VS Code + PlatformIO）:
;   - このフォルダを VS Code で開く
;   - サイドバーの PlatformIO アイコンから:
;       Build  : ✓
;       Upload : →
;       Monitor: コンセントアイコン
;   - CLI で:
;       pio run                 (build)
;       pio run -t upload       (write to board)
;       pio device monitor      (serial monitor)

[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
