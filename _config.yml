title: PCA9685 4脚ロボット
description: Arduino Uno と PCA9685 で多脚ロボットの RC サーボを同期制御するための学習教材
lang: ja

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-relative-links
  - jekyll-remote-theme
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

# just-the-docs settings
color_scheme: dark
search_enabled: true
heading_anchors: true
aux_links:
  "GitHub":
    - "https://github.com/jkoba0512/Adafruit-servo-driver-tutorial"

# Mermaid 図を有効化
mermaid:
  version: "10.9.0"

# Jekyll 全般
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# ビルドから除外
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - DEVELOPMENT.md
  - .gitignore
  - figures
  - "*.py"
  - pyproject.toml
  - uv.lock
  - .venv
